name: floodrisk
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - xarray
  - netcdf4
  - rasterio
  - geopandas
  - pyproj
  - shapely
  - requests
  - pyyaml
  - matplotlib
  - jupyterlab
  - pytest
  - pip
  # Installed from conda-forge (not pip) so numba/llvmlite come as prebuilt
  # binaries instead of being compiled from source (which needs cmake).
  - numba
  - scikit-image
  - pysheds
  - cdsapi
