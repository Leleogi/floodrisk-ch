[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodrisk-ch"
version = "0.1.0"
description = "Event-driven flood risk mapping for Switzerland from open data"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
floodrisk = "floodrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
